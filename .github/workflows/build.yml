name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: movieplus-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    # Only on tag push, and only if signing secrets exist.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release-key.jks
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > key.properties

      - name: Build release APK
        if: env.KEYSTORE_B64 != ''
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        if: env.KEYSTORE_B64 != ''
        run: cp app/build/outputs/apk/release/*.apk movieplus.apk

      - uses: softprops/action-gh-release@v2
        if: env.KEYSTORE_B64 != ''
        with:
          files: movieplus.apk
          generate_release_notes: true
